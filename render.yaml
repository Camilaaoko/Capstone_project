services:
  - type: web
    name: kemsa-supply-chain-intelligence
    runtime: python
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: gunicorn dashboard.app:server --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
