name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Smoke Data & Build Analytics Database
        run: |
          python generate_data.py --facilities 47 --commodities 10 --months 3 --output-dir output
          python etl_pipeline.py --input-dir output --output-dir analytics

      - name: Run Test Suite
        run: |
          pytest tests/ -v --cov=analytics_module --cov=dashboard

